# Deploy SnakeArcade to the socha3 Windows/IIS server whenever main changes.
#
# Runs on a SELF-HOSTED runner on the production server (labels:
# self-hosted, windows, snakearcade), so the server needs no inbound access.
# One-time runner setup: scripts/install-runner.md
#
# SECURITY: this repo is public and the runner lives on the production box.
# This workflow must NEVER be triggered by pull_request / pull_request_target
# (fork PRs would run arbitrary code on the server). Only push to main and a
# manual workflow_dispatch (which only users with write access can start).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; queue instead of cancelling a deploy mid-copy.
concurrency:
  group: deploy-snakearcade-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ROOT: 'C:\WebApps\SnakeArcade'
  SERVICE_NAME: SnakeArcadeNode
  APP_PORT: '3105'
  PUBLIC_URL: https://snakearcade.socha3.com/
  BACKUP_ROOT: 'C:\WebApps\SnakeArcade-backups'
  # Used only if node.exe is not already on the runner's PATH.
  NODE_DIR: 'C:\Program Files\nodejs'

jobs:
  deploy:
    # Only the real repo, and only main (workflow_dispatch can target any branch).
    if: github.repository == 'bigmac529/SnakeArcade' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, snakearcade]
    timeout-minutes: 20
    environment:
      name: production
      url: https://snakearcade.socha3.com/
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use the server's Node.js
        shell: powershell
        run: |
          $nodeCmd = Get-Command node.exe -ErrorAction SilentlyContinue
          if ($nodeCmd) {
            $nodeDir = Split-Path -Parent $nodeCmd.Source
          } elseif (Test-Path -LiteralPath (Join-Path $env:NODE_DIR 'node.exe')) {
            $nodeDir = $env:NODE_DIR
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $nodeDir -Encoding ascii
          } else {
            throw "node.exe not found on PATH or in $env:NODE_DIR. Install Node.js LTS on the server."
          }
          Write-Host "Node dir: $nodeDir"
          & (Join-Path $nodeDir 'node.exe') --version
          & (Join-Path $nodeDir 'npm.cmd') --version

      - name: Install production dependencies
        shell: powershell
        run: |
          if (Test-Path -LiteralPath 'package-lock.json') {
            npm.cmd ci --omit=dev --no-audit --no-fund
          } else {
            npm.cmd install --omit=dev --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw "npm failed with exit code $LASTEXITCODE" }

      - name: Deploy to IIS content root
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy.ps1 `
            -SourceDir "$env:GITHUB_WORKSPACE" `
            -AppRoot "$env:APP_ROOT" `
            -ServiceName "$env:SERVICE_NAME" `
            -Port ([int]$env:APP_PORT) `
            -PublicUrl "$env:PUBLIC_URL" `
            -BackupRoot "$env:BACKUP_ROOT" `
            -RequirePublicHealthy
          if ($LASTEXITCODE -ne 0) { throw "deploy.ps1 failed with exit code $LASTEXITCODE" }
