# Reusable: deploy one release build (the exact zip published by
# build-and-deploy-test.yml) to one site on the self-hosted runner.
# Called by build-and-deploy-test.yml (test) and deploy-production.yml (production).
#
# Site settings come from the GitHub Environment's variables
# (Settings > Environments > <name> > Environment variables):
#
#   variable               meaning                        production default / test default
#   APP_ROOT               IIS content root               C:\WebApps\SnakeArcade / C:\WebApps\SnakeArcadeTest
#   SERVICE_NAME           WinSW Node service             SnakeArcadeNode / SnakeArcadeTestNode
#   APP_PORT               local Node port (must match    3105 / 3107
#                          PORT in the service XML)       (set to 0 to read PORT= from ENV_FILE)
#   PUBLIC_URL             site root; health check is     https://snakearcade.socha3.com/ /
#                          <PUBLIC_URL>api/health         https://test.snakearcade.socha3.com/
#   ENV_FILE               settings/secrets file          <APP_ROOT>-config\snakearcade.env
#   BACKUP_ROOT            data backups                   <APP_ROOT>-backups
#   REQUIRE_PUBLIC_HEALTH  fail if PUBLIC_URL isn't       true / false (the local health check on
#                          healthy                        localhost:<APP_PORT> is always required)
#
# The defaults below are the values the server admin confirmed; an environment
# variable overrides them, so each one lives in one place.
#
# SECURITY: the runner lives on the production server. Never call this from a
# pull_request trigger.
name: Deploy build (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment / site to deploy to (test or production)
        type: string
        required: true
      tag:
        description: Build tag, build-<number>-<sha7>
        type: string
        required: true
      sha256:
        description: SHA-256 of snakearcade-<tag>.zip (already verified by the caller)
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to ${{ inputs.environment }}
    runs-on: [self-hosted, windows, snakearcade]
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.site.outputs.public_url }}
    concurrency:
      group: deploy-snakearcade-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.environment }}
      BUILD_TAG: ${{ inputs.tag }}
      BUILD_SHA256: ${{ inputs.sha256 }}
      VAR_APP_ROOT: ${{ vars.APP_ROOT }}
      VAR_SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      VAR_APP_PORT: ${{ vars.APP_PORT }}
      VAR_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      VAR_ENV_FILE: ${{ vars.ENV_FILE }}
      VAR_BACKUP_ROOT: ${{ vars.BACKUP_ROOT }}
      VAR_REQUIRE_PUBLIC_HEALTH: ${{ vars.REQUIRE_PUBLIC_HEALTH }}
      # Used only if node.exe is not already on the runner's PATH.
      NODE_DIR: 'C:\Program Files\nodejs'
    steps:
      # Deploy tooling (scripts\deploy.ps1, .github\scripts) comes from the
      # workflow's commit; the app itself comes only from the build zip.
      - name: Checkout deploy scripts
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/scripts

      - name: Resolve site settings
        id: site
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          switch ($env:TARGET) {
            "production" {
              $d = @{ root = 'C:\WebApps\SnakeArcade'; service = 'SnakeArcadeNode'; port = '3105'; url = 'https://snakearcade.socha3.com/'; require = 'true' }
            }
            "test" {
              $d = @{ root = 'C:\WebApps\SnakeArcadeTest'; service = 'SnakeArcadeTestNode'; port = '3107'; url = 'https://test.snakearcade.socha3.com/'; require = 'false' }
            }
            default { throw "Unknown environment '$env:TARGET' (expected test or production)." }
          }
          $root = if ($env:VAR_APP_ROOT) { $env:VAR_APP_ROOT } else { $d.root }
          $service = if ($env:VAR_SERVICE_NAME) { $env:VAR_SERVICE_NAME } else { $d.service }
          $port = if ($env:VAR_APP_PORT) { $env:VAR_APP_PORT } else { $d.port }
          $url = if ($env:VAR_PUBLIC_URL) { $env:VAR_PUBLIC_URL } else { $d.url }
          $envFile = if ($env:VAR_ENV_FILE) { $env:VAR_ENV_FILE } else { "$root-config\snakearcade.env" }
          $backup = if ($env:VAR_BACKUP_ROOT) { $env:VAR_BACKUP_ROOT } else { "$root-backups" }
          $require = if ($env:VAR_REQUIRE_PUBLIC_HEALTH) { $env:VAR_REQUIRE_PUBLIC_HEALTH } else { $d.require }
          if (-not $url) { throw "Set the PUBLIC_URL variable on the '$env:TARGET' environment (Settings > Environments > $env:TARGET)." }
          if ($url -notmatch '^https?://[^/\s]+/?$') { throw "PUBLIC_URL '$url' must be a site root like https://host/." }
          if (-not $port) { $port = '0' }   # 0: deploy.ps1 reads PORT= from the env file
          if ($port -ne '0' -and $port -notmatch '^\d{2,5}$') { throw "APP_PORT '$port' is not a port number." }
          if ($require -notin @('true', 'false')) { throw "REQUIRE_PUBLIC_HEALTH must be true or false (got '$require')." }
          $lines = @(
            "DEPLOY_APP_ROOT=$root", "DEPLOY_SERVICE=$service", "DEPLOY_PORT=$port", "DEPLOY_URL=$url",
            "DEPLOY_ENV_FILE=$envFile", "DEPLOY_BACKUP_ROOT=$backup", "DEPLOY_REQUIRE_PUBLIC=$require"
          )
          [IO.File]::AppendAllText($env:GITHUB_ENV, (($lines -join "`n") + "`n"))
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "public_url=$url`n")
          $lines | ForEach-Object { Write-Host $_ }

      - name: Use the server's Node.js
        shell: powershell
        run: |
          $nodeCmd = Get-Command node.exe -ErrorAction SilentlyContinue
          if ($nodeCmd) {
            $nodeDir = Split-Path -Parent $nodeCmd.Source
          } elseif (Test-Path -LiteralPath (Join-Path $env:NODE_DIR 'node.exe')) {
            $nodeDir = $env:NODE_DIR
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $nodeDir -Encoding ascii
          } else {
            throw "node.exe not found on PATH or in $env:NODE_DIR. Install Node.js LTS on the server."
          }
          Write-Host "Node dir: $nodeDir"
          & (Join-Path $nodeDir 'node.exe') --version

      - name: Download and verify ${{ inputs.tag }}
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\.github\scripts\fetch-build.ps1 `
            -Tag "$env:BUILD_TAG" -Sha256 "$env:BUILD_SHA256" -WorkDir (Join-Path $env:RUNNER_TEMP 'snakearcade-build')
          if ($LASTEXITCODE -ne 0) { throw "fetch-build.ps1 failed with exit code $LASTEXITCODE" }

      - name: Deploy to ${{ inputs.environment }}
        shell: powershell
        run: |
          $deployArgs = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\scripts\deploy.ps1',
            '-SourceDir', $env:STAGING_DIR,
            '-AppRoot', $env:DEPLOY_APP_ROOT,
            '-ServiceName', $env:DEPLOY_SERVICE,
            '-Port', $env:DEPLOY_PORT,
            '-PublicUrl', $env:DEPLOY_URL,
            '-BackupRoot', $env:DEPLOY_BACKUP_ROOT,
            '-EnvFile', $env:DEPLOY_ENV_FILE,
            '-ExpectedBuild', $env:BUILD_TAG
          )
          if ($env:DEPLOY_REQUIRE_PUBLIC -eq 'true') { $deployArgs += '-RequirePublicHealthy' }
          powershell.exe @deployArgs
          if ($LASTEXITCODE -ne 0) { throw "deploy.ps1 failed with exit code $LASTEXITCODE" }

      - name: Summary
        shell: powershell
        run: |
          $md = @(
            "### Deployed ``$env:BUILD_TAG`` to **$env:TARGET**", "",
            "| | |", "| --- | --- |",
            "| Site | $env:DEPLOY_URL |",
            "| Content root | ``$env:DEPLOY_APP_ROOT`` |",
            "| Service | ``$env:DEPLOY_SERVICE`` |",
            "| Zip SHA-256 | ``$env:BUILD_SHA256`` |"
          )
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, (($md -join "`n") + "`n"))

      - name: Clean up the staging folder
        if: always()
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'snakearcade-build'
          if (Test-Path -LiteralPath $dir) { Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue }
